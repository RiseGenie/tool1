# Local full stack: Postgres + MinIO (S3-compatible) + web + worker.  NOTE: not exercised in the authoring sandbox (no Docker daemon).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: rg, POSTGRES_PASSWORD: rg, POSTGRES_DB: recorder }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  createbucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set m http://minio:9000 minio minio12345; mc mb -p m/recordings; exit 0"
  web: &app
    build: .
    depends_on: [db, minio]
    environment: &env
      DATABASE_URL: postgres://rg:rg@db:5432/recorder
      APP_URL: http://localhost:3000
      APP_SECRET: local-dev-secret-change-me
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: recordings
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-none}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports: ["3000:3000"]
    command: sh -c "npm run migrate && npm run start"
  worker:
    <<: *app
    ports: []
    command: npm run worker
volumes: { pgdata: {}, miniodata: {} }
